[metadata]
name = lstm_log_analysis
version = 0.1.0
author = MLOps & Security Intelligence Team
description = Production-Ready Deep Learning Log Anomaly Detection with TensorFlow and LSTMs
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = .
include = src*

[flake8]
max-line-length = 100
exclude = .tox,.git,docs,venv,.venv,__pycache__,build,dist
ignore = E203, W503
